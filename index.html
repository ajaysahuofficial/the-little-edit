
<div class="modal" id="customModal">
  <div class="modal-box">
    <span class="close" onclick="closeModal('customModal')">×</span>

    <h2>Customize Your Gift 🎁</h2>

    <input id="customName" placeholder="Your Full Name">
    <input id="customPhone" placeholder="Mobile Number">
    <input id="customEmail" type="email" placeholder="Email Address">

    <input id="customProduct" placeholder="Select Gift Product">

    <input id="printName" placeholder="Name to Print (Optional)">

    <textarea id="customMessage"
      placeholder="Write Your Personal Message"></textarea>

    <label>Upload Your Photo</label>
    <input id="customImage" type="file"
      accept="image/png,image/jpeg,image/webp">

    <button class="primary-button"
      onclick="submitCustomization()">
      Submit Custom Order
    </button>

    <p><small>Upload one image, maximum 5 MB.</small></p>
  </div>
</div>
